<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de productos | Essencia Divina</title>
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta name="theme-color" content="#3d2a42">
  <link rel="icon" href="../img/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body data-pagina="panel">
  <header class="cabecera">
    <div class="envoltura cabecera__interior">
      <a class="marca" href="panel.html">
        <img class="marca__logo" src="../img/logo.jpg" alt="" width="76" height="76">
        <span class="marca__texto"><strong>Essencia Divina</strong><small>Panel</small></span>
      </a>
      <div class="hero__acciones">
        <a class="boton boton--borde" href="../index.html">Ver tienda</a>
        <button class="boton" type="button" id="cerrar-sesion">Cerrar sesión</button>
      </div>
    </div>
  </header>
  <main id="contenido">
    <div class="envoltura">
      <div class="panel-cabecera">
        <div>
          <p class="sobrelinea">Administración</p>
          <h1>Productos</h1>
        </div>
      </div>
      <div class="panel">
        <form class="panel-tarjeta" id="form-producto">
          <h2 id="titulo-form">Nuevo producto</h2>
          <label>Nombre
            <input name="nombre" required maxlength="120" autocomplete="off">
            <span class="error-campo" data-error="nombre"></span>
          </label>
          <label>Categoría
            <select name="categoria" required></select>
            <span class="error-campo" data-error="categoria"></span>
          </label>
          <label>Descripción
            <textarea name="descripcion" required maxlength="2000"></textarea>
            <span class="error-campo" data-error="descripcion"></span>
          </label>
          <label>Precio (COP)
            <input name="precio" inputmode="decimal" required autocomplete="off">
            <span class="error-campo" data-error="precio"></span>
          </label>
          <label>Imagen
            <input name="imagen" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">
            <span class="ayuda">JPG, PNG o WEBP. Máximo 2 MB.</span>
            <span class="error-campo" data-error="imagen"></span>
          </label>
          <img id="vista-imagen" alt="" width="120" height="150" hidden>
          <label class="check">
            <input name="activo" type="checkbox" checked>
            Producto visible en la tienda
          </label>
          <div class="acciones-form">
            <button class="boton" type="submit">Guardar producto</button>
            <button class="boton boton--borde" type="button" id="cancelar-edicion" hidden>Cancelar</button>
          </div>
          <p id="mensaje-form" role="status"></p>
        </form>
        <section aria-labelledby="titulo-lista">
          <h2 id="titulo-lista" class="sr">Listado</h2>
          <div id="lista-productos" class="lista-admin"></div>
        </section>
      </div>
    </div>
  </main>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
