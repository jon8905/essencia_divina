<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso administrador | Essencia Divina</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#3d2a42">
  <link rel="icon" href="../img/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body data-pagina="login">
  <header class="cabecera">
    <div class="envoltura cabecera__interior">
      <a class="marca" href="../index.html">
        <img class="marca__logo" src="../img/logo.jpg" alt="" width="76" height="76">
        <span class="marca__texto"><strong>Essencia Divina</strong><small>Administración</small></span>
      </a>
      <a href="../index.html">Volver a la tienda</a>
    </div>
  </header>
  <main class="acceso" id="contenido">
    <form class="acceso__tarjeta" id="form-ingreso">
      <p class="sobrelinea">Panel</p>
      <h1>Ingresar</h1>
      <p>Solo el administrador autorizado puede gestionar los productos.</p>
      <label>Correo
        <input name="email" type="email" autocomplete="username" required maxlength="160">
      </label>
      <label>Contraseña
        <input name="password" type="password" autocomplete="current-password" required maxlength="72">
      </label>
      <button class="boton" type="submit">Ingresar</button>
      <p id="mensaje-ingreso" role="alert"></p>
    </form>
  </main>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
